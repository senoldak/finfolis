# Geçici deneme (26 Kasım 2026): OECD SDMX GitHub sunucularından hangi istemciye yanıt veriyor. Sonuç alınınca silinir.
name: OECD deneme
on: workflow_dispatch
permissions:
  contents: read
jobs:
  deneme:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Node fetch (botun isteği) ve curl
        run: |
          cat > ./oecd-deneme.mjs <<'JS'
          // scripts/haberler/lib.mjs indir() ile aynı istek: User-Agent + Accept, 120 sn zaman aşımı.
          const u = 'https://sdmx.oecd.org/public/rest/data/OECD.SDD.STES,DSD_KEI@DF_KEI,4.0/.+M+Q.B1GQ_Q+UNEMP+IRLT....?startPeriod=2025-05&dimensionAtObservation=AllDimensions';
          const headers = { 'User-Agent': 'finfolis-haber-botu (+https://finfolis.com)', Accept: 'application/vnd.sdmx.data+csv; charset=utf-8' };
          for (let i = 1; i <= 3; i++) {
            const r = await fetch(u, { headers, signal: AbortSignal.timeout(120000) }).catch((e) => ({ status: e.message.slice(0, 40), text: async () => '' }));
            console.log('SONUC node', i, r.status, (await r.text()).split('\n').length);
            await new Promise((s) => setTimeout(s, 15000));
          }
          JS
          node ./oecd-deneme.mjs
          for i in 1 2; do
            echo "SONUC curl $i $(curl -s -o /tmp/y -w '%{http_code}' -m 90 -A 'finfolis-haber-botu (+https://finfolis.com)' -H 'Accept: application/vnd.sdmx.data+csv; charset=utf-8' 'https://sdmx.oecd.org/public/rest/data/OECD.SDD.STES,DSD_KEI@DF_KEI,4.0/.+M+Q.B1GQ_Q+UNEMP+IRLT....?startPeriod=2025-05&dimensionAtObservation=AllDimensions')"
            sleep 15
          done
