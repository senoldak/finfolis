# Haber botunu çalıştırır ve sonucu repoya ekler.
# Cloudflare yeni commit'i görünce siteyi otomatik yeniden derler.
# Zamanlama Cloudflare'deki saat Worker'ındadır (İstanbul saatiyle 06:40, 08:40 … 22:40, 00:40; bkz. mecmua/saat/src/ayarlar.js).
# GitHub'ın cron'u UTC'dir ve yaz/kış saatini izlemez, bu yüzden burada schedule yok.
name: Haber botu

on:
  workflow_dispatch:

permissions:
  contents: write
  # Yeni içerik yazıldığında "Yayınla" iş akışını başlatmak için.
  actions: write

concurrency:
  group: haber-botu
  cancel-in-progress: false

jobs:
  hent:
    runs-on: ubuntu-latest
    # Süre bütçesi yeni yazıyı ~15–18. dakikada keser; Gemini 503 beklemeleri için pay bırakılır (repo açık, dakika ücretsiz).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sıradaki çalışma tetiklendiği anki commit'i değil, dalın en son hâlini alır; yoksa eski görülen listesiyle aynı haberleri yeniden yazar.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci --no-audit --no-fund

      # Ortak motor private mecmua deposundadır: yalnız motor/ klasörü, salt-okur deploy anahtarıyla çekilir. Yalnız motor modunda.
      - name: Motoru getir
        if: ${{ vars.MOTOR_TUR == '1' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: senoldak/mecmua
          ssh-key: '${{ secrets.MECMUA_OKUMA }}'
          path: .mecmua
          sparse-checkout: |
            motor
            standartlar
          persist-credentials: false

      - name: Haberleri üret
        id: hent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_KULLANIM_DOSYASI: ${{ runner.temp }}/gemini-kullanim.json
          MOTOR_URL: ${{ vars.MOTOR_URL }} # Katman 3: tur başında Gemini bütçesi okunur
          MOTOR_ANAHTARI: ${{ secrets.MOTOR_ANAHTARI }}
          # Resmi olmayan kaynakların şifreli listesi ve izi için (bkz. scripts/haberler/gizli.mjs).
          KAYNAK_ANAHTARI: ${{ secrets.KAYNAK_ANAHTARI }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          # Gölge denetim (20 Ekim): turda en çok bu kadar denetim kararı Gemma'ya da sorulur, yalnız loga yazılır (golge.mjs).
          GEMINI_GOLGE: ${{ vars.GEMINI_GOLGE }}
          MAKS_HABER: ${{ vars.MAKS_HABER }}
          # Ortak motor modu (private mecmua'dan salt-okur çekilir): vars.MOTOR_TUR=1 iken aday turu motorla sürülür.
          MOTOR_TUR: ${{ vars.MOTOR_TUR }}
          # Standartlar kural kitabı tek kaynaktan (mecmua/standartlar/siteler); dosya yoksa standart.mjs yerel kopyayı okur.
          STANDART_KURALLAR: ${{ github.workspace }}/.mecmua/standartlar/siteler/finfolis.json
          MOTOR_DIZIN: ${{ github.workspace }}/.mecmua/motor
          # Ortak yayın kapısının ikinci okuması (motor/ortak/kapi.mjs): vars.KAPI_MOD = kapali | golge | acik (boşsa kapalı).
          KAPI_MOD: ${{ vars.KAPI_MOD }}
        run: |
          if [ -z "$KAYNAK_ANAHTARI" ]; then echo "::error::KAYNAK_ANAHTARI secret'ı yok; haber beslemeleri okunamaz."; exit 1; fi
          node scripts/haberler/hent-haberler.mjs

      # Veri sayfaları (/veri/…) için resmi TCMB/TÜİK verisi. Başarısız olursa son bilinen değer tarihiyle kalır;
      # haber üretimini durdurmaz. Veri değişmediyse dosyaya dokunulmaz, bu yüzden pratikte günde bir değişir.
      - name: Resmi verileri güncelle
        # Acil durdurma açıksa tur hiçbir şey yazmaz (hent adımı durdu=1 çıktısı verir). Motor turu hata verse de çalışır.
        if: ${{ !cancelled() && steps.hent.outputs.durdu != '1' }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          # Konut fiyat endeksi ve işsizlik (TCMB EVDS). Yoksa bu iki bölüm atlanır, son bilinen değer kalır.
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: node scripts/haberler/resmi-veri.mjs --yaz

      # Üretim adımı düşse de (zaman aşımı, motor hatası, beklenmeyen hata) o ana kadar yazılan haberler ve durum dosyası
      # commit edilir (F4); aksi hâlde aynı adaylar sonraki turda Gemini'yi yeniden harcıyordu. İş yine kırmızı biter.
      # Üç aylık standartlar raporu (yol haritası madde 22): biten çeyreğin ilk 31 gününde defter sayıları bir kez
      # src/data/standartlar-raporu/<YYYY>-c<N>.json'a yazılır. Hata haber işini düşürmez.
      - name: Çeyrek standartlar raporu
        if: ${{ !cancelled() && vars.MOTOR_TUR == '1' }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          MOTOR_URL: ${{ vars.MOTOR_URL }}
          MOTOR_ANAHTARI: ${{ secrets.MOTOR_ANAHTARI }}
          GH_TOKEN: ${{ github.token }}
        run: node .mecmua/motor/bin/ceyrek-raporu.mjs --site finfolis --dizin src/data/standartlar-raporu --kural scripts/haberler/standart-kurallar.json

      - name: Commit
        id: commit
        if: ${{ !cancelled() && steps.hent.outputs.durdu != '1' }}
        env:
          ADET: ${{ steps.hent.outputs.adet || '0' }}
        run: |
          git config user.name "finfolis-haber-botu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/haberler src/data/piyasa.json src/data/resmi.json scripts/haberler/gorulen.json
          # Çeyrek raporu klasörü ilk rapora kadar yoktur; yoksa git add pathspec hatası verir.
          [ -d src/data/standartlar-raporu ] && git add src/data/standartlar-raporu
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
            exit 0
          fi
          ICERIK=$(git diff --cached --name-only -- src/content/haberler src/data/piyasa.json src/data/resmi.json)
          if [ -z "$ICERIK" ]; then
            git commit -m "Haber botu: durum güncellendi [skip ci]"
          elif [ "${ADET:-0}" = "0" ]; then
            git commit -m "Haber botu: piyasa verisi güncellendi"
          else
            git commit -m "Haber botu: ${ADET} yeni yazı"
          fi
          [ -n "$ICERIK" ] && echo "yayin=1" >> "$GITHUB_OUTPUT"
          # Telegram ve diğer işler de depoya yazar; çakışmada yazılan haberler kaybolmasın diye 5 kez denenir.
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1

      # Planlı (ileri tarihli) yazılar vakti gelince bu turla yayına girer: vadesi gelip sitede 404 dönen yazı varsa yayınla.
      - name: Planlı yazılar
        id: planlagt
        if: ${{ !cancelled() && steps.hent.outputs.durdu != '1' && steps.commit.outputs.yayin != '1' }}
        run: node scripts/planlagt.mjs

      # Botun push'u yayın iş akışını kendiliğinden tetiklemez (GITHUB_TOKEN); elle başlatılır.
      - name: Siteyi yayınla
        if: ${{ !cancelled() && (steps.commit.outputs.yayin == '1' || steps.planlagt.outputs.yayin == '1') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run yayinla.yml --ref "${{ github.ref_name }}"

      # Telegram gönderimi Cloudflare'deki mecmua-saat Worker'ında: haberler vardiyaya yayılarak 10 dakikada bir gider.

      - name: Yapılandırma hatası bildirimi
        if: always() && steps.hent.outputs.konfig_hatasi == '1'
        run: |
          echo "::error::Gemini anahtarı/modeli reddedildi (400/401/403/404). GEMINI_API_KEY ve GEMINI_MODEL değerlerini kontrol edin; haberler harcanmadı."
          exit 1

      # Katman 0 (Gemini kota planı): bu işin Gemini kullanımını model ve amaç başına mecmua-saat'e bildirir. İşi düşürmez.
      - name: Gemini kullanımını saate bildir
        if: always()
        continue-on-error: true
        env:
          GEMINI_KULLANIM_DOSYASI: ${{ runner.temp }}/gemini-kullanim.json
          MOTOR_URL: ${{ vars.MOTOR_URL }}
          MOTOR_ANAHTARI: ${{ secrets.MOTOR_ANAHTARI }}
        run: node scripts/haberler/gemini-rapor.mjs finfolis
