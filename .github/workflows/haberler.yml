# Haber botunu çalıştırır ve sonucu repoya ekler.
# Yeni yazı varsa bot, Yayınla iş akışını (yayinla.yml) başlatır; o da siteyi derleyip Cloudflare'e gönderir.
# Zamanlama Cloudflare'deki saat Worker'ındadır (İstanbul saatiyle 06:40, 08:40 … 22:40, 00:40; bkz. mecmua/saat/src/ayarlar.js).
# GitHub'ın cron'u UTC'dir ve yaz/kış saatini izlemez, bu yüzden burada schedule yok.
name: Haber botu

on:
  workflow_dispatch:

permissions:
  contents: write
  # Yeni içerik yazıldığında "Yayınla" iş akışını başlatmak için.
  actions: write

concurrency:
  group: haber-botu
  cancel-in-progress: false

jobs:
  hent:
    runs-on: ubuntu-latest
    # Süre bütçesi yeni yazıyı ~15–18. dakikada keser; Gemini 503 beklemeleri için pay bırakılır (repo açık, dakika ücretsiz).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sıradaki çalışma tetiklendiği anki commit'i değil, dalın en son hâlini alır; yoksa eski görülen listesiyle aynı haberleri yeniden yazar.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci --no-audit --no-fund

      # Ortak motor private mecmua deposundadır: yalnız motor/ klasörü, salt-okur deploy anahtarıyla çekilir. Yalnız motor modunda.
      - name: Motoru getir
        if: ${{ vars.MOTOR_TUR == '1' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: senoldak/mecmua
          ssh-key: '${{ secrets.MECMUA_OKUMA }}'
          path: .mecmua
          sparse-checkout: |
            motor
            standartlar
          persist-credentials: false

      - name: Haberleri üret
        id: hent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_KULLANIM_DOSYASI: ${{ runner.temp }}/gemini-kullanim.json
          MOTOR_URL: ${{ vars.MOTOR_URL }} # Katman 3: tur başında Gemini bütçesi okunur
          MOTOR_ANAHTARI: ${{ secrets.MOTOR_ANAHTARI }}
          # Resmi olmayan kaynakların şifreli listesi ve izi için (bkz. scripts/haberler/gizli.mjs).
          KAYNAK_ANAHTARI: ${{ secrets.KAYNAK_ANAHTARI }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          # Gemini yönlendirici (25 Ekim): vars.GEMINI_ZINCIR=0 iken eski düzen (ana model + tek yedek); geri dönüş yolu.
          GEMINI_ZINCIR: ${{ vars.GEMINI_ZINCIR }}
          # Gemini Faz 2 (27 Ekim): gömme ön elemesi (yok/golge/1), eşikler ve vektör dosyası (1 = aç).
          GOMME_ON_ELEME: ${{ vars.GOMME_ON_ELEME }}
          GOMME_ALT_ESIK: ${{ vars.GOMME_ALT_ESIK }}
          GOMME_UST_ESIK: ${{ vars.GOMME_UST_ESIK }}
          GOMME_VEKTOR: ${{ vars.GOMME_VEKTOR }}
          # Gömme önbelleği açık repoda şifreli durur (aday başlıklar gizli kaynakları ele vermesin): kaynak anahtarından
          # ayrı amaçla türetilen anahtar (gomme.mjs). Anahtar yoksa önbellek dosyası yazılmaz.
          GOMME_ANAHTARI: ${{ secrets.KAYNAK_ANAHTARI }}
          # Gölge denetim (20 Ekim): turda en çok bu kadar denetim kararı Gemma'ya da sorulur, yalnız loga yazılır (golge.mjs).
          GEMINI_GOLGE: ${{ vars.GEMINI_GOLGE }}
          # PDF gölgesi (28 Ekim): 1 ise merkez bankası PDF adresleri kuyruğa yazılır, yayından sonra Docling ölçer.
          PDF_GOLGE: ${{ vars.PDF_GOLGE }}
          PDF_GOLGE_DOSYASI: ${{ runner.temp }}/pdf-golge.jsonl
          MAKS_HABER: ${{ vars.MAKS_HABER }}
          # Ortak motor modu (private mecmua'dan salt-okur çekilir): vars.MOTOR_TUR=1 iken aday turu motorla sürülür.
          MOTOR_TUR: ${{ vars.MOTOR_TUR }}
          # Standartlar kural kitabı tek kaynaktan (mecmua/standartlar/siteler); dosya yoksa standart.mjs yerel kopyayı okur.
          STANDART_KURALLAR: ${{ github.workspace }}/.mecmua/standartlar/siteler/finfolis.json
          MOTOR_DIZIN: ${{ github.workspace }}/.mecmua/motor
          # Ortak yayın kapısının ikinci okuması (motor/ortak/kapi.mjs): vars.KAPI_MOD = kapali | golge | acik (boşsa kapalı).
          KAPI_MOD: ${{ vars.KAPI_MOD }}
        run: |
          if [ -z "$KAYNAK_ANAHTARI" ]; then echo "::error::KAYNAK_ANAHTARI secret'ı yok; haber beslemeleri okunamaz."; exit 1; fi
          node scripts/haberler/hent-haberler.mjs

      # Veri sayfaları (/veri/…) için resmi TCMB/TÜİK verisi. Başarısız olursa son bilinen değer tarihiyle kalır;
      # haber üretimini durdurmaz. Veri değişmediyse dosyaya dokunulmaz, bu yüzden pratikte günde bir değişir.
      - name: Resmi verileri güncelle
        # Acil durdurma açıksa tur hiçbir şey yazmaz (hent adımı durdu=1 çıktısı verir). Motor turu hata verse de çalışır.
        if: ${{ !cancelled() && steps.hent.outputs.durdu != '1' }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          # Konut fiyat endeksi, işsizlik ve piyasa faizleri (TCMB EVDS). Yoksa bu bölümler atlanır, son bilinen değer kalır.
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: node scripts/haberler/resmi-veri.mjs --yaz

      # BIST sektör ve tematik endeks karnesi (gecikmeli piyasa verisi).
      - name: Sektör karnesini güncelle
        if: ${{ !cancelled() && steps.hent.outputs.durdu != '1' }}
        continue-on-error: true
        timeout-minutes: 5
        run: node scripts/haberler/sektor-karnesi.mjs --yaz

      # TÜFE'den arındırılmış reel BİST 30 endeks serisi
      - name: Reel BİST verilerini güncelle
        if: ${{ !cancelled() && steps.hent.outputs.durdu != '1' }}
        continue-on-error: true
        timeout-minutes: 5
        run: node scripts/haberler/reel-bist-veri.mjs --yaz

      # TCMB Altın Kazancı (P/L) ve rezerv göstergelerini otomatik güncelle
      - name: TCMB ve makro göstergeleri güncelle
        if: ${{ !cancelled() && steps.hent.outputs.durdu != '1' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
          # Yalnız PPK ve FOMC metin tonu (scripts/veri/ppk-ton.mjs, fomc-ton.mjs): yeni metin yoksa Gemini çağrısı yapılmaz.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_KULLANIM_DOSYASI: ${{ runner.temp }}/gemini-kullanim.json
        run: |
          node scripts/tcmb-altin-kazanci.mjs
          node scripts/tcmb-swap-orani.mjs || true
          node scripts/tcmb-net-pozisyon-degisimi.mjs || true
          node scripts/veri/abd-tahvil.mjs || true
          node scripts/veri/abd-tahvilleri-uret.mjs --yaz || true
          node scripts/veri/dunya-faizleri.mjs --yaz || true
          node scripts/veri/emsal-ulkeler.mjs --yaz || true
          node scripts/veri/veri-takvimi.mjs --yaz || true
          node scripts/veri/ppk-metinler.mjs --yaz || true
          node scripts/veri/ppk-ton.mjs --yaz || true
          node scripts/veri/fomc-metinler.mjs --yaz || true
          node scripts/veri/fed-projeksiyonlari.mjs --yaz || true
          node scripts/veri/fomc-ton.mjs --yaz || true

      # Üretim adımı düşse de (zaman aşımı, motor hatası, beklenmeyen hata) o ana kadar yazılan haberler ve durum dosyası
      # commit edilir (F4); aksi hâlde aynı adaylar sonraki turda Gemini'yi yeniden harcıyordu. İş yine kırmızı biter.
      # Üç aylık standartlar raporu (yol haritası madde 22): biten çeyreğin ilk 31 gününde defter sayıları bir kez
      # src/data/standartlar-raporu/<YYYY>-c<N>.json'a yazılır. Hata haber işini düşürmez.
      - name: Çeyrek standartlar raporu
        if: ${{ !cancelled() && vars.MOTOR_TUR == '1' }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          MOTOR_URL: ${{ vars.MOTOR_URL }}
          MOTOR_ANAHTARI: ${{ secrets.MOTOR_ANAHTARI }}
          GH_TOKEN: ${{ github.token }}
        run: node .mecmua/motor/bin/ceyrek-raporu.mjs --site finfolis --dizin src/data/standartlar-raporu --kural scripts/haberler/standart-kurallar.json

      - name: Commit
        id: commit
        if: ${{ !cancelled() && steps.hent.outputs.durdu != '1' }}
        env:
          ADET: ${{ steps.hent.outputs.adet || '0' }}
        run: |
          git config user.name "finfolis-haber-botu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/haberler src/data public/data public/grafikler scripts/haberler/gorulen.json
          # Gömme dosyaları ilk açılışa kadar yoktur; yoksa git add pathspec hatası verir.
          [ -f scripts/haberler/gomme-onbellek.json ] && git add scripts/haberler/gomme-onbellek.json
          # Çeyrek raporu klasörü ilk rapora kadar yoktur; yoksa git add pathspec hatası verir.
          [ -d src/data/standartlar-raporu ] && git add src/data/standartlar-raporu
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
            exit 0
          fi
          ICERIK=$(git diff --cached --name-only -- src/content/haberler src/data public/data public/grafikler)
          if [ -z "$ICERIK" ]; then
            git commit -m "Haber botu: durum güncellendi [skip ci]"
          elif [ "${ADET:-0}" = "0" ]; then
            git commit -m "Haber botu: piyasa verisi güncellendi"
          else
            git commit -m "Haber botu: ${ADET} yeni yazı"
          fi
          [ -n "$ICERIK" ] && echo "yayin=1" >> "$GITHUB_OUTPUT"
          # Telegram ve diğer işler de depoya yazar; çakışmada yazılan haberler kaybolmasın diye 5 kez denenir.
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1

      # Planlı (ileri tarihli) yazılar vakti gelince bu turla yayına girer: vadesi gelip sitede 404 dönen yazı varsa yayınla.
      - name: Planlı yazılar
        id: planlagt
        if: ${{ !cancelled() && steps.hent.outputs.durdu != '1' && steps.commit.outputs.yayin != '1' }}
        run: node scripts/planlagt.mjs

      # Botun push'u yayın iş akışını kendiliğinden tetiklemez (GITHUB_TOKEN); elle başlatılır.
      - name: Siteyi yayınla
        if: ${{ !cancelled() && (steps.commit.outputs.yayin == '1' || steps.planlagt.outputs.yayin == '1') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run yayinla.yml --ref "${{ github.ref_name }}"

      # Telegram gönderimi Cloudflare'deki mecmua-saat Worker'ında: haberler vardiyaya yayılarak 10 dakikada bir gider.

      - name: Yapılandırma hatası bildirimi
        if: always() && steps.hent.outputs.konfig_hatasi == '1'
        run: |
          echo "::error::Gemini anahtarı/modeli reddedildi (400/401/403/404). GEMINI_API_KEY ve GEMINI_MODEL değerlerini kontrol edin; haberler harcanmadı."
          exit 1

      # PDF gölgesi (28 Ekim, scripts/haberler/pdf-golge.py): bot merkez bankası PDF'lerini bugünkü gibi yalnız başlıkla
      # okur; burada yeni PDF'ler Docling ile metne çevrilip ölçülür (yalnız log ve iş eseri). vars.PDF_GOLGE=1 açar.
      # Yayından sonra çalışır, yayını geciktirmez. Ölçülen adresler küçük bir önbellekte tutulur, yeniden işlenmez.
      - name: PDF gölgesi kuyruğu
        id: pdfkuyruk
        if: ${{ !cancelled() && vars.PDF_GOLGE == '1' }}
        run: |
          if [ -s "$RUNNER_TEMP/pdf-golge.jsonl" ]; then echo "var=1" >> "$GITHUB_OUTPUT"; else echo "Bu turda PDF yok."; fi

      - name: PDF gölgesi ölçülenler
        if: ${{ steps.pdfkuyruk.outputs.var == '1' }}
        continue-on-error: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/pdf-golge
          key: pdf-golge-yapilan-${{ github.run_id }}
          restore-keys: pdf-golge-yapilan-

      - name: PDF gölgesi yeni mi
        id: pdfyeni
        if: ${{ steps.pdfkuyruk.outputs.var == '1' }}
        continue-on-error: true
        env:
          PDF_GOLGE_SAY: '1'
        run: python3 scripts/haberler/pdf-golge.py "$RUNNER_TEMP/pdf-golge.jsonl" ~/pdf-golge/yapilan.txt "$RUNNER_TEMP/pdf-cikti"

      - name: Docling önbelleği
        if: ${{ steps.pdfyeni.outputs.yeni == '1' }}
        continue-on-error: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: docling-2.143.1-cpu-v1

      - name: PDF gölgesi (Docling)
        if: ${{ steps.pdfyeni.outputs.yeni == '1' }}
        continue-on-error: true
        timeout-minutes: 20
        run: |
          python3 -m venv "$RUNNER_TEMP/pdf-venv"
          P="$RUNNER_TEMP/pdf-venv/bin/pip"
          "$P" install --quiet --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch>=2.6,<3' torchvision
          "$P" install --quiet --disable-pip-version-check 'docling==2.143.1'
          "$RUNNER_TEMP/pdf-venv/bin/python" scripts/haberler/pdf-golge.py "$RUNNER_TEMP/pdf-golge.jsonl" ~/pdf-golge/yapilan.txt "$RUNNER_TEMP/pdf-cikti"

      - name: PDF gölgesi çıktıları
        if: ${{ steps.pdfyeni.outputs.yeni == '1' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pdf-golge
          path: ${{ runner.temp }}/pdf-cikti/*.md
          retention-days: 14

      # Katman 0 (Gemini kota planı): bu işin Gemini kullanımını model ve amaç başına mecmua-saat'e bildirir. İşi düşürmez.
      - name: Gemini kullanımını saate bildir
        if: always()
        continue-on-error: true
        env:
          GEMINI_KULLANIM_DOSYASI: ${{ runner.temp }}/gemini-kullanim.json
          MOTOR_URL: ${{ vars.MOTOR_URL }}
          MOTOR_ANAHTARI: ${{ secrets.MOTOR_ANAHTARI }}
        run: node scripts/haberler/gemini-rapor.mjs finfolis
