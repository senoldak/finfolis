# Siteyi GitHub Actions'ta derleyip Cloudflare'e gönderir; Cloudflare'in ücretsiz derleme dakikası harcanmaz.
# Elle yapılan push'larda içerik ya da site kodu değiştiyse kendiliğinden çalışır. Botun push'u (GITHUB_TOKEN)
# push tetiklemediği için bot, yeni haber yazdığında bu iş akışını "gh workflow run" ile başlatır.
# "[skip ci]" içeren commit'ler (yalnız durum dosyası) yayın başlatmaz.
name: Yayınla

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - '.github/workflows/yayinla.yml'
  workflow_dispatch:

permissions:
  contents: read

# Sırada bekleyen yayın varsa eskisi iptal edilir; her yayın dalın en son hâlini derler.
concurrency:
  group: yayinla
  cancel-in-progress: true

jobs:
  yayinla:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci --no-audit --no-fund

      # Astro görsel önbelleği (node_modules/.astro): kapakların JPEG/WebP türevleri her derlemede sıfırdan kodlanıyordu;
      # haber sayısıyla doğrusal artar. npm ci node_modules'ı sildiği için adım ondan sonra gelir.
      - name: Astro görsel önbelleği
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.astro
          key: astro-gorsel-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: astro-gorsel-${{ hashFiles('package-lock.json') }}-

      - name: Derle
        run: npm run build

      - name: Cloudflare'e gönder
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.34.0 deploy

      # Cloudflare ücretsiz planında bir sürüm en fazla 20.000 dosya olabilir; sınıra yaklaşınca uyarır.
      - name: Dosya sayısı
        run: |
          n=$(find dist -type f | wc -l)
          echo "dist: $n dosya (sınır 20.000)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$n" -gt 15000 ]; then echo "::warning::dist $n dosya; Cloudflare ücretsiz sınırı 20.000"; fi

      # Yeni yazıları IndexNow ile arama motorlarına bildirir (Bing, Yandex, Seznam, Naver). Başarısız olsa da yayın bozulmaz.
      - name: IndexNow bildirimi
        continue-on-error: true
        run: node scripts/indexnow.mjs
