# Haftalık yazım uyarısı (28 Ekim 2026): son 7 günün yazılarında akana'nın tanımadığı yeni sözcükleri listeler
# (scripts/haberler/yazim-uyari.py). Yalnız uyarıdır: yayını durdurmaz, repoya yazmaz. Liste iş özetine ve repodaki açık
# "Yazım uyarısı (haftalık)" konusuna yorum olarak düşer (yoksa açılır).
name: Yazım uyarısı

on:
  workflow_dispatch:
    inputs:
      gun:
        description: Kaç günlük yazı
        default: '7'
  schedule:
    - cron: '30 5 * * 1' # pazartesi 05:30 UTC

permissions:
  contents: read
  issues: write

concurrency:
  group: yazim-uyari
  cancel-in-progress: true

jobs:
  uyar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            src/content
            scripts/haberler

      - name: Kur (akana)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --disable-pip-version-check akana==0.8.0

      - name: Denetle
        id: denetle
        env:
          GUN: ${{ inputs.gun || '7' }}
        run: |
          "$RUNNER_TEMP/venv/bin/python" scripts/haberler/yazim-uyari.py tr src/content/haberler "$GUN" "$RUNNER_TEMP/yazim.md"
          cat "$RUNNER_TEMP/yazim.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Konuya yaz
        if: steps.denetle.outputs.bulgu != '' && steps.denetle.outputs.bulgu != '0'
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          baslik='Yazım uyarısı (haftalık)'
          n=$(gh issue list --state open --search "in:title \"$baslik\"" --json number,title -q ".[] | select(.title == \"$baslik\") | .number" | head -1)
          if [ -z "$n" ]; then
            printf '%s\n\n' 'Her pazartesi yazım denetleyicisinin (akana) tanımadığı yeni sözcükler buraya yorum olarak yazılır.' 'Yalnız uyarıdır, yayını durdurmaz. Çoğu doğru sözcüktür; gerçek hatayı yazıda düzelt, doğru sözcük bir daha listelenmez.' 'Kaynak: scripts/haberler/yazim-uyari.py, .github/workflows/yazim-uyari.yml.' > "$RUNNER_TEMP/aciklama.md"
            n=$(basename "$(gh issue create --title "$baslik" --body-file "$RUNNER_TEMP/aciklama.md")")
          fi
          gh issue comment "$n" --body-file "$RUNNER_TEMP/yazim.md"
