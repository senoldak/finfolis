# Tek seferlik deneme (28 Ekim 2026): yazım denetleyicilerinin arşiv ölçümü (scripts/yazim-olcum/olc.py).
# Türkçe: Zemberek ile akana (finfolis + kifobu); Norveççe: Hunspell nb_NO ile Divvun (tidsrost). Yalnız elle başlar,
# repoya yazmaz; çıktılar iş özetinde ve eserinde. Ölçüm bitince bu dosya ve betik silinir.
name: Yazım ölçümü (deneme)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  olc:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ARAC: ${{ runner.temp }}/arac
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: senoldak/kifobu
          path: _kifobu
          sparse-checkout: src/content
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: senoldak/tidsrost
          path: _tidsrost
          sparse-checkout: src/content
          persist-credentials: false

      - name: Kur (akana)
        continue-on-error: true
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --disable-pip-version-check akana==0.8.0
          "$RUNNER_TEMP/venv/bin/pip" list 2>/dev/null | grep -i "^akana "

      - name: Kur (Zemberek 0.17.1)
        continue-on-error: true
        run: |
          mkdir -p "$ARAC/zemberek/pom"
          cat > "$ARAC/zemberek/pom/pom.xml" <<'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>olcum</groupId><artifactId>olcum</artifactId><version>1</version>
            <repositories><repository><id>zemberek</id><url>https://raw.githubusercontent.com/ahmetaa/maven-repo/master</url></repository></repositories>
            <dependencies><dependency><groupId>zemberek-nlp</groupId><artifactId>zemberek-normalization</artifactId><version>0.17.1</version></dependency></dependencies>
          </project>
          EOF
          mvn -q -f "$ARAC/zemberek/pom/pom.xml" dependency:copy-dependencies -DoutputDirectory="$ARAC/zemberek/lib"
          ls "$ARAC/zemberek/lib"
          javac -encoding UTF-8 -cp "$ARAC/zemberek/lib/*" -d "$ARAC/zemberek" scripts/yazim-olcum/ZemberekKontrol.java

      - name: Kur (Hunspell nb_NO)
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq hunspell >/dev/null
          mkdir -p "$ARAC/hunspell"
          for f in nb_NO.dic nb_NO.aff; do
            curl -fsSL --retry 3 -o "$ARAC/hunspell/$f" "https://raw.githubusercontent.com/LibreOffice/dictionaries/master/no/$f"
          done
          hunspell -v | head -1

      - name: Kur (Divvun)
        continue-on-error: true
        run: |
          mkdir -p "$ARAC/divvun/indir" && cd "$ARAC/divvun/indir"
          gh release download 'divvunspell/v1.0.0-beta.13' -R divvun/divvunspell -p '*x86_64-unknown-linux-gnu*.tgz'
          gh release download 'speller-nob/dev-latest' -R giellalt/lang-nob -p '*mobile.pkt.tar.zst' -p '*noarch-all.pkt.tar.zst'
          gh release download 'grammar-nob/dev-latest' -R giellalt/lang-nob -p '*.drb'
          gh release download 'dev-latest' -R divvun/divvun-runtime -p '*x86-64-unknown-linux-gnu*'
          ls -la
          for f in *.tgz; do tar -xzf "$f"; done
          for f in *.tar.xz; do tar -xJf "$f"; done
          for f in *.tar.zst; do mkdir -p "z-$f" && tar --zstd -xf "$f" -C "z-$f"; done
          find . -type f \( -name '*.bhfst' -o -name '*.zhfst' -o -name '*.drb' -o -name 'divvunspell' -o -name 'divvun-runtime' -o -name '*.so' \) | head -40
          cp "$(find . -type f -name divvunspell | head -1)" ../divvunspell
          cp "$(find . -type f -name divvun-runtime | head -1)" ../divvun-runtime
          cp "$(find . -type f \( -name '*.bhfst' -o -name '*.zhfst' \) | head -1)" ../nob.bhfst
          cp "$(find . -type f -name '*.drb' | head -1)" ../grammar-nob.drb
          find . -name '*.so*' -exec cp {} .. \;
          chmod +x ../divvunspell ../divvun-runtime
          ../divvunspell --version || true
          LD_LIBRARY_PATH="$ARAC/divvun" ../divvun-runtime --help | head -20 || true

      - name: Ölç
        run: |
          export LD_LIBRARY_PATH="$ARAC/divvun"
          "$RUNNER_TEMP/venv/bin/python" scripts/yazim-olcum/olc.py "$ARAC" "$RUNNER_TEMP/yazim-cikti" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: yazim-cikti
          path: ${{ runner.temp }}/yazim-cikti/
          retention-days: 7
